# stack_blocks_two · 采集配置（本项目新增，非修改上游）
# 用法：cd /home/gm/data/RoboTwin && CUDA_VISIBLE_DEVICES=0 bash collect_data.sh stack_blocks_two <config_name>
# 来源：复制 task_config/demo_clean.yml，只改 episode_num / language_num。
# ⚠️ collect_data.py 没有命令行覆盖，episode_num 只能从这里改 —— 这就是官方
#    `task_config/create_task_config.sh` 存在的意义。
render_freq: 0
episode_num: 1
use_seed: false
save_freq: 15
embodiment: [aloha-agilex]
language_num: 1
domain_randomization:
  random_background: false
  cluttered_table: false
  clean_background_rate: 1
  random_head_camera_dis: 0
  random_table_height: 0
  random_light: false
  crazy_random_light_rate: 0
camera:
  head_camera_type: D435
  wrist_camera_type: D435
  collect_head_camera: true
  collect_wrist_camera: true
data_type:
  rgb: true
  third_view: false
  depth: false
  pointcloud: false
  observer: false
  endpose: true
  qpos: true
  mesh_segmentation: false
  actor_segmentation: false
pcd_down_sample_num: 1024
pcd_crop: true
save_path: ./data
clear_cache_freq: 5
collect_data: true
eval_video_log: true
